name: Update Firewall Domain Threat Feeds

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at the top of every hour
  workflow_dispatch:     # Allows manual trigger

permissions:
  contents: write        # Required to save file modifications back into main branch

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Request Modules
        run: pip install requests

      - name: Run Domain Clean Script
        run: python parse_domains.py

      - name: Commit and Push File Directly to Main
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add pa-clean-domains.txt
          git commit -m "Automated update of Domain master blocklist" || echo "No changes to commit"
          git push origin HEAD:main
