name: Update PA Domain EDL
on:
  schedule:
    - cron: '30 * * * *' # Runs automatically every hour
  workflow_dispatch: # Allows manual executions via button click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Direct Threat Feed Sync
        run: |
          # Pull the raw plain text file straight into your repo
          curl -L "https://githubusercontent.com" -o pa-clean-domains.txt

      - name: Commit and Push Clean Domain List
        run: |
          git config --global user.name "edl-bot"
          git config --global user.email "edl-bot@github.com"
          git add pa-clean-domains.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated aggregation of clean PA domains" && git push)
